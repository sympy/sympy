# ------------------------------------------------------------------ #
#                                                                    #
#              SymPy CI script for Github Actions                    #
#                                                                    #
#  Upload a nightly wheel to the Anaconda scientific-python channel  #
#                                                                    #
#         https://scientific-python.org/specs/spec-0004/             #
#                                                                    #
# ------------------------------------------------------------------ #

name: nightly-wheel-upload
on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  nightly-wheel:
    name: Build Nightly Wheel
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel

      - name: Upload built wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-wheel-dist
          path: dist
          if-no-files-found: error

  # Keep this job separate from the nightly-wheel job to limit exposure to the
  # secrets.
  nightly-wheel-upload:
    name: Upload Nightly Wheel
    needs: nightly-wheel
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Download built wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-wheel-dist
          path: dist

      - name: Upload wheel
        uses: scientific-python/upload-nightly-action@5a74a2a4ec19d7ab8b5317c1cdd356c150d92cd0 # 0.6.6
        with:
          artifacts_path: dist
          # This token is generated from anaconda.org
          # https://github.com/scientific-python/upload-nightly-action/issues/111
          anaconda_nightly_upload_token: ${{ secrets.ANACONDA_ORG_UPLOAD_TOKEN }} # zizmor: ignore[secrets-outside-env]
